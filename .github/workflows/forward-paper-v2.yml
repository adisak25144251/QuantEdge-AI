name: Forward Paper Candidate V2

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: forward-paper-v2-main
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout immutable candidate branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify candidate and collect future-only bars
        run: npm run forward:collect

      - name: Run quality gates
        run: npm run ci

      - name: Commit append-only forward evidence
        shell: bash
        run: |
          git config user.name "quantedge-forward-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/forward/us-forward-hybrid-v2-ledger.json public/evidence/forward-v2-latest.json
          if git diff --cached --quiet; then
            echo "No new completed market bar."
            exit 0
          fi
          git commit -m "research: append forward paper evidence"
          git push origin HEAD:main
